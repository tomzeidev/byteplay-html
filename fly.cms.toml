# Optional separate CMS deployment. Replace the app name before using this file.
app = 'replace-with-your-byteplay-cms-app'
primary_region = 'syd'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  CMS_DATABASE = '/data/cms.sqlite3'
  CMS_UPLOADS = '/data/uploads'
  CMS_COOKIE_SECURE = 'true'
  CMS_TRUST_PROXY = '1'
  CMS_SITE_URL = 'https://tomzeidev.github.io/byteplay-html/'

[[mounts]]
  source = 'cms_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '15s'
  method = 'GET'
  path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
