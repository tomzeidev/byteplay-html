<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <!-- OG tags injected by JS once post data loads -->
  <meta property="og:site_name" content="BYTE Play">
  <meta id="og-title"       property="og:title"       content="BYTE Play — Developer Blog">
  <meta id="og-description" property="og:description" content="">
  <meta id="og-image"       property="og:image"       content="/img/og-banner.png">

  <title id="page-title">Loading... — BYTE Play</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/x-icon" href="/img/favicon.ico">

  <style>
    body { background: #fff; color: #1a1a1a; }

    /* ── Loading state ───────────────────────────── */
    .post-loading {
      text-align: center;
      padding: 8rem 2rem;
      color: #9ca3af;
      font-size: 1rem;
    }

    .post-loading-spinner {
      width: 32px; height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1.2rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error state ─────────────────────────────── */
    .post-error {
      text-align: center;
      padding: 6rem 2rem;
      display: none;
    }

    .post-error h2 { font-size: 1.6rem; color: #111; margin-bottom: 0.6rem; }
    .post-error p  { color: #6b7280; margin-bottom: 1.4rem; }

    /* ── Post header ─────────────────────────────── */
    .post-hero {
      background: #f8f8f8;
      padding: 4rem 2rem 3rem;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    .post-hero-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 1.6rem;
      transition: color 0.2s;
    }

    .post-hero-back:hover { color: var(--accent2); }
    .post-hero-back::before { content: '←'; }

    .post-hero-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .post-cat-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid;
    }

    .tag-fertilia      { color: #16a34a; border-color: rgba(22,163,74,0.3);   background: rgba(22,163,74,0.07); }
    .tag-cab           { color: #7c3aed; border-color: rgba(124,58,237,0.3);  background: rgba(124,58,237,0.07); }
    .tag-announcements { color: #d97706; border-color: rgba(217,119,6,0.3);   background: rgba(217,119,6,0.07); }

    .post-hero-date {
      font-size: 0.82rem;
      color: #9ca3af;
      font-weight: 500;
    }

    .post-hero h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #111;
      margin-bottom: 0.6rem;
      line-height: 1.15;
    }

    .post-hero-author {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    /* ── Post body ───────────────────────────────── */
    .post-body {
      max-width: 740px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    /* Section heading */
    .post-body h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #e67e22;
      text-align: center;
      margin: 2.2rem 0 0.6rem;
      letter-spacing: -0.01em;
    }

    /* First h2 less top margin */
    .post-body h2:first-child { margin-top: 0; }

    /* Paragraph */
    .post-body p {
      font-size: 1rem;
      line-height: 1.7;
      color: #374151;
      text-align: center;
      margin-bottom: 0.4rem;
    }

    /* Image */
    .post-body img {
      width: 100%;
      max-width: 600px;
      height: auto;
      border-radius: 8px;
      margin: 1rem auto;
      display: block;
    }

    /* Fixed / Changed list */
    .fixed-list {
      list-style: none;
      padding: 0;
      margin: 0.8rem 0 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fixed-list li {
      font-size: 0.9rem;
      color: #6b7280;
      padding: 6px 12px 6px 0;
      border-bottom: 1px solid #f3f4f6;
      line-height: 1.55;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .fixed-list li::before {
      content: '—';
      color: #d1d5db;
      flex-shrink: 0;
    }

    .fixed-list li:last-child { border-bottom: none; }

    /* Sign-off */
    .post-signoff {
      margin-top: 2.4rem;
      padding: 1.2rem 1.6rem;
      border-left: 3px solid var(--accent2);
      background: rgba(28,135,201,0.04);
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: #374151;
      font-style: italic;
    }

    /* Button link */
    .post-btn-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent2);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 10px 22px;
      border-radius: 999px;
      margin: 0.8rem auto;
      transition: background 0.2s, transform 0.2s;
      display: block;
      width: fit-content;
    }

    .post-btn-link:hover { background: #155a7c; transform: translateY(-2px); color: #fff; }

    /* Navigation between posts */
    .post-nav {
      max-width: 740px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      border-top: 1px solid #f3f4f6;
      padding-top: 2rem;
    }

    .post-nav-link {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 45%;
      text-decoration: none;
    }

    .post-nav-link.next { text-align: right; margin-left: auto; }

    .post-nav-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .post-nav-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent2);
      line-height: 1.3;
      transition: color 0.2s;
    }

    .post-nav-link:hover .post-nav-title { color: #111; }

    @media (max-width: 600px) {
      .post-hero  { padding: 3rem 1.2rem 2rem; }
      .post-body  { padding: 2rem 1.2rem 3rem; }
      .post-nav   { padding: 1.4rem 1.2rem 2rem; flex-direction: column; }
      .post-nav-link, .post-nav-link.next { max-width: 100%; text-align: left; margin: 0; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="main-header">
    <div class="logo">
      <img src="nova-logo.png" alt="BYTE Play Logo">
    </div>
    <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
    <nav id="main-nav">
      <ul>
        <li><a href="index">Home</a></li>
        <li><a href="servers">Servers</a></li>
        <li><a href="developer-blog" class="active">Posts</a></li>
        <li><a href="baltop">DB</a></li>
        <li><a href="https://byteplay.tebex.io">Shop</a></li>
      </ul>
    </nav>
  </header>

  <!-- LOADING STATE -->
  <div class="post-loading" id="post-loading">
    <div class="post-loading-spinner"></div>
    Loading post...
  </div>

  <!-- ERROR STATE -->
  <div class="post-error" id="post-error">
    <h2>Post not found</h2>
    <p>This post doesn't exist or has been moved.</p>
    <a href="developer-blog" class="back-button">Back to Blog</a>
  </div>

  <!-- POST CONTENT (rendered by JS) -->
  <div id="post-content" style="display:none;">
    <section class="post-hero" id="post-hero"></section>
    <div class="post-body"    id="post-body"></div>
    <div class="post-nav"     id="post-nav"></div>
  </div>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <script>
    // ── Hamburger ──────────────────────────────────
    document.getElementById('hamburger').addEventListener('click', function () {
      this.classList.toggle('open');
      document.getElementById('main-nav').classList.toggle('open');
    });

    // ── Footer ─────────────────────────────────────
    fetch('footer.html').then(r => r.text()).then(html => {
      document.getElementById('footer-placeholder').innerHTML = html;
    });

    // ── Post registry ──────────────────────────────
    // Add new posts here in chronological order (newest first)
    const POST_REGISTRY = [
      'fertilia-update-9',
      'fertilia-update-8',
      'fertilia-update-7',
      'fertilia-update-6',
      'fertilia-update-5',
      'fertilia-update-4',
      'fertilia-update-3',
      'fertilia-update-2',
      'fertilia-update-1'
    ];

    // ── Category tag class ─────────────────────────
    function catClass(cat) {
      const map = { fertilia: 'tag-fertilia', cab: 'tag-cab', announcements: 'tag-announcements' };
      return map[cat] || 'tag-fertilia';
    }

    function catLabel(cat) {
      const map = { fertilia: 'Fertilia', cab: 'Collect All Blocks', announcements: 'Announcement' };
      return map[cat] || cat;
    }

    // ── Render content blocks ──────────────────────
    function renderBlocks(blocks) {
      return blocks.map(block => {
        switch (block.type) {
          case 'h2':
            return `<h2>${block.text}</h2>`;
          case 'p':
            return `<p>${block.html}</p>`;
          case 'img':
            return `<img src="${block.src}" alt="" loading="lazy">`;
          case 'fixed':
            const items = block.items.map(i => `<li>${i}</li>`).join('');
            return `<ul class="fixed-list">${items}</ul>`;
          case 'signoff':
            return `<div class="post-signoff">~ ${block.text}</div>`;
          case 'button':
            return `<a href="${block.href}" class="post-btn-link" target="_blank" rel="noopener">${block.text}</a>`;
          default:
            return '';
        }
      }).join('\n');
    }

    // ── Load and render post ───────────────────────
    async function loadPost(id) {
      // Derive base URL from post.html's own location so it works whether the
      // site is at the domain root or inside a subdirectory.
      const base = window.location.href.split('?')[0].replace(/post\.html$/, '');
      const jsonURL = base + 'posts/' + id + '.json';
      console.log('[BYTE Blog] Fetching:', jsonURL);

      try {
        const res = await fetch(jsonURL);
        if (!res.ok) throw new Error('HTTP ' + res.status + ' — ' + jsonURL);
        const post = await res.json();

        // Update page metadata
        document.getElementById('page-title').textContent = `${post.title} — BYTE Play`;
        document.getElementById('og-title').setAttribute('content', `${post.title} — BYTE Play`);
        document.getElementById('og-description').setAttribute('content', post.excerpt || '');
        if (post.thumb) document.getElementById('og-image').setAttribute('content', post.thumb);

        // Render hero
        document.getElementById('post-hero').innerHTML = `
          <a href="developer-blog" class="post-hero-back">Back to Blog</a>
          <div class="post-hero-meta">
            <span class="post-cat-tag ${catClass(post.category)}">${catLabel(post.category)}</span>
            <span class="post-hero-date">${post.date}</span>
          </div>
          <h1>${post.title}</h1>
          <div class="post-hero-author">By ${post.author || 'BYTE Play Devs'}</div>
        `;

        // Render body
        document.getElementById('post-body').innerHTML = renderBlocks(post.content);

        // Render prev/next nav
        const idx = POST_REGISTRY.indexOf(id);
        let navHTML = '';
        if (idx < POST_REGISTRY.length - 1) {
          navHTML += `<a href="post.html?id=${POST_REGISTRY[idx + 1]}" class="post-nav-link prev">
            <span class="post-nav-label">← Previous</span>
            <span class="post-nav-title">${POST_REGISTRY[idx + 1].replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</span>
          </a>`;
        }
        if (idx > 0) {
          navHTML += `<a href="post.html?id=${POST_REGISTRY[idx - 1]}" class="post-nav-link next">
            <span class="post-nav-label">Next →</span>
            <span class="post-nav-title">${POST_REGISTRY[idx - 1].replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</span>
          </a>`;
        }
        document.getElementById('post-nav').innerHTML = navHTML;

        // Show post, hide loading
        document.getElementById('post-loading').style.display = 'none';
        document.getElementById('post-content').style.display = 'block';

      } catch (err) {
        console.error('[BYTE Blog] Failed to load post:', err.message);
        document.getElementById('post-loading').style.display = 'none';
        const errEl = document.getElementById('post-error');
        errEl.querySelector('p').textContent = 'Could not load post: ' + err.message;
        errEl.style.display = 'block';
      }
    }

    // ── Boot ───────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const postId = params.get('id');

    if (postId) {
      loadPost(postId);
    } else {
      // No ID — redirect to blog list
      window.location.href = 'developer-blog';
    }
  </script>

</body>
</html>
